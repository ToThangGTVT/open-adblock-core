[workspace]
members = ["crates/engine", "crates/jni", "crates/ffi", "vendor/netstack-smoltcp"]
default-members = ["crates/engine", "crates/jni", "crates/ffi"]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.99"
repository = "https://github.com/ToThangGTVT/open-adblock-core"

[workspace.dependencies]
openadblock-engine = { path = "crates/engine" }
serde_json = "=1.0.154"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = "debuginfo"
