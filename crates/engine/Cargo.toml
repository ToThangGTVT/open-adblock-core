[package]
name = "openadblock-engine"
description = "Platform-neutral ad-blocking tunnel engine: userspace TCP/UDP stack, DNS filtering, HTTPS filtering, DPI circumvention."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
name = "openadblock_engine"

[dependencies]
netstack-smoltcp = { version = "=0.2.4", path = "../../vendor/netstack-smoltcp" }
tokio = { version = "=1.54.1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
futures-util = { version = "=0.3.34", features = ["sink"] }
socket2 = "=0.6.5"
etherparse = "=0.16.0"
libc = "=0.2.191"
tracing = { version = "0.1", features = ["max_level_off"] }

hickory-resolver = { version = "=0.26.3", default-features = false, features = ["tokio", "tls-ring", "https-ring", "quic-ring", "webpki-roots"] }
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json.workspace = true
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf", "unicode-case"] }

rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "x509-parser", "zeroize"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.11"
hyper = { version = "=1.12.0", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
ring = "=0.17.14"
adblock = { version = "=0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "css-validation"] }
async-compression = { version = "=0.4.51", default-features = false, features = ["tokio", "gzip", "zlib", "brotli"] }
tokio-util = { version = "=0.7.20", default-features = false, features = ["io"] }

[[bench]]
name = "matcher"
harness = false
